# First fixed-input whole-capsule case. SI units. NOT calibrated experimental data.
# CONSTITUTIVE CHOICE: rate-independent J2 elastic-perfectly-plastic MCC core;
# isotropic elastic plane-stress EC midsurface shell. No fracture in this run.
case=coated
material=j2
quasistatic=1

# PAPER: nominal capsule diameter 1.0 mm and representative shell thickness 10 um.
diameter=0.001
thickness=0.00001

# ASSUMPTIONS: rounded first estimates, not parameters measured in the capsule paper.
core-E=1000000000
core-nu=0.3
yield-stress=10000000
hardening=0
shell-E=600000000
shell-nu=0.3
shell-density=1200
# PAPER reference density adopted provisionally as this core's continuum density.
core-density=1355
# ASSUMPTIONS in the implementation: bonded interface, no initial gap,
# frictionless rigid planes, rate-independent material response.
# FIRST SCOPE: 0 to 5% compression, before attempting damage or rupture.
strain=0.05

# NUMERICAL INPUTS: not material properties; no mass scaling.
spacing=0.0000625
contact-factor=50
tie-factor=20
cfl=0.2
dt-scale=1
threads=4
load-steps=20
ramp-steps=1000
max-stage-steps=200000
max-steps=5000000
relaxation-damping=0.002
# Acceptance of each displacement level requires three successive checks.
# Relative nodal-force norm, plate imbalance, kinetic/(mean_force*displacement).
force-tolerance=0.05
balance-tolerance=0.02
kinetic-tolerance=0.0001
